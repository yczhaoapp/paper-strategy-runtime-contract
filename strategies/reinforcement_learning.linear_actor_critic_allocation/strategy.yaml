contract_version: 1.4.0
strategy_id: reinforcement_learning.linear_actor_critic_allocation
strategy_version: 1.0.0
kind: reinforcement_learning
entrypoint: strategy.py:Strategy
required_profiles:
- core.bar.v1
- portfolio.batch.v1
- training.rl.v1
lifecycle:
  training: required
  inference: required
  backtest: required
  state_checkpointing: true
data_requirements:
- stream_id: bars
  kind: bar
  timeframe:
    mode: bar
    interval: P1D
    timezone: UTC
    calendar: 24/7
    alignment: epoch
  symbols:
  - PUBLIC.AAPL
  required_fields:
  - close
  - high
  - low
  - open
  - volume
  optional_fields: []
  lookback: 2
  depth: null
  max_staleness_ns: null
action_requirements:
  allowed:
  - no_op
  - target_weight
  max_abs_position: null
  max_order_quantity: null
resources:
  sandbox: development
  network: deny
  filesystem: artifact_store_only
  allowed_imports:
  - math
  - numpy
  - statistics
  timeout_seconds: 60
  memory_mb: 512
  process_limit: 32
deterministic: true
seed: 7
extensions: {}
