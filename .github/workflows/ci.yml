name: PSRC 完整验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psrc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-verification:
    name: Host verification (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact: linux
          - os: windows-latest
            label: Windows
            artifact: windows
          - os: macos-latest
            label: macOS
            artifact: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: 安装固定版本 uv
        run: python -m pip install --disable-pip-version-check uv==0.8.22
      - name: 执行完整开发环境验证
        run: uv run --frozen --python 3.12 --extra dev --extra adapters python scripts/verify.py --fetch
      - name: 保留开发环境证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psrc-development-evidence-${{ matrix.artifact }}
          path: reports/generated
          if-no-files-found: warn
          retention-days: 30

  strict-container-verification:
    name: Strict container verification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 执行完整严格容器验证
        run: python3 scripts/verify-container.py
      - name: 保留严格容器证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psrc-strict-container-evidence
          path: reports/strict
          if-no-files-found: warn
          retention-days: 30
